<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101011"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Five — More connecting</title><style>
*{box-sizing:border-box}body{margin:0;background:#101011;color:#faf6ee;font:16px system-ui,sans-serif}header{position:sticky;top:0;background:#101011f5;border-bottom:1px solid #343237;z-index:2}nav,main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}nav strong{font-size:30px;color:#e8bd68;margin-right:auto}button,input{font:inherit}button{cursor:pointer;border:1px solid #e8bd68;border-radius:14px;padding:13px 18px;background:#e8bd68;color:#101011;font-weight:700}button.alt{background:transparent;color:#e8bd68}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}h1{font-size:clamp(36px,7vw,76px);line-height:1.04;letter-spacing:-.055em;margin:18px 0}h2{font-size:28px}p,small{color:#bdb7ad;line-height:1.6}em{color:#e8bd68;font-style:normal}.panel,article{background:#1b1b1e;border:1px solid #343237;border-radius:24px;padding:24px;margin:12px 0}.hero{padding:clamp(24px,6vw,70px);background:radial-gradient(ellipse at top right,#40321c,#1b1b1e 65%)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:28px 0}.stats b{display:block;font-size:30px;color:#e8bd68}.avatar{height:130px;display:grid;place-items:center;background:linear-gradient(135deg,#574329,#27252a);border-radius:16px;font-size:54px;color:#e8bd68}.score{float:right;color:#e8bd68}.options{display:grid;gap:12px}.options button{text-align:left}.chat{max-width:720px;margin:auto}.messages{height: min(42vh,400px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:#111;border-radius:16px}.bubble{padding:12px;border-radius:15px;background:#343237;max-width:85%;overflow-wrap:anywhere}.me{align-self:flex-end;background:#e8bd68;color:#101011}form{display:flex;gap:8px;margin:14px 0}input{min-width:0;flex:1;background:#101011;color:white;border:1px solid #555;border-radius:12px;padding:12px}.timer{color:#e8bd68;font-variant-numeric:tabular-nums;font-weight:700}.notice{padding:12px;border-left:3px solid #e8bd68;background:#27231c;margin:8px 0}footer{padding:20px;color:#aaa;text-align:center;font-size:13px}progress{width:100%;accent-color:#e8bd68}@media(max-width:600px){nav,main{padding:14px}nav button{padding:10px;font-size:13px}.panel,article{padding:18px}.actions{display:grid;gap:8px}}
</style></head><body><header><nav><strong>five.</strong><button class="alt" id="home">Home</button><button class="alt" id="matches">Matches</button><button class="alt" id="alerts">Reminders</button></nav></header><main><div id="notices" aria-live="polite"></div><section id="view"></section></main><footer>Five · Orlando concept · Fictional profiles and simulated chats · 18+</footer><script>
const $=id=>document.getElementById(id), H=3600000, key='five-pwa-v1';
const questions=[['What are you actually looking for?','Something serious','Casual & fun','Friends first','Open'],['Best first date vibe?','Coffee & talk','Drinks & energy','Walk or activity','Dinner'],['What do you love most?','Gaming','Fitness','Food','Music','Outdoors','Books & art'],['Your energy?','Introverted','Extroverted','Depends on the day'],['What matters most?','Honesty','Humor','Kindness','Adventure']];
const people=[['Marcus',23,1,2,0,2,1,'Gaming nights and easy laughs.'],['Lina',22,0,0,2,0,2,'Foodie who loves real conversation.'],['Diego',25,3,2,1,1,3,'Always up for a new spot downtown.'],['Emma',21,2,0,5,0,0,'Quiet coffee dates and honest conversation.'],['Priya',24,0,1,3,2,1,'Music and good conversation.'],['Alex',23,1,3,0,0,1,'Gamer who loves a dinner date.'],['Sofia',22,3,0,5,1,3,'Creative, curious, coffee dates.'],['Jordan',25,0,2,1,2,2,'Kind, active, looking for something real.']];
const venues=[['Haan Coffee','15% off'],['Craft & Common','Free pastry'],['Deeply Coffee','10% off'],['Bynx','Coffee + vinyl'],['Mathers Social','Happy hour'],['Otto’s High Dive','Cocktail deal'],['Thrive Lounge','First round']];
let state={answers:[],chats:{},expired:[],reminders:false};try{Object.assign(state,JSON.parse(localStorage.getItem(key)||'{}'))}catch{}let page='home',current=null,q=0;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notice('Local storage unavailable. Changes may not persist.')}}function notice(t){const d=document.createElement('div');d.className='notice';d.textContent=t;$('notices').prepend(d);setTimeout(()=>d.remove(),12000)}
function button(t,fn,alt=false){const b=document.createElement('button');b.textContent=t;if(alt)b.className='alt';b.onclick=fn;return b}function render(markup){$('view').innerHTML=markup}function home(){page='home';render('<div class="panel hero"><small>ORLANDO · INTENTIONAL DATING</small><h1>Less swiping.<br><em>More connecting.</em></h1><p>Five intentional matches. One day to decide. If you both choose to continue, your conversation stays.</p><div class="stats"><span><b>01</b>Quick quiz</span><span><b>05</b>Matches</span><span><b>24h</b>To connect</span></div><div id="start"></div><p>Meet in public at potential local coffee shops or restaurants when you are both ready.</p></div>');$('start').append(button('Get my five matches →',()=>{if(state.answers.length===5)matches();else{q=0;quiz()}}))}
function quiz(){page='quiz';render('<div class="panel chat"><small>QUESTION '+(q+1)+' OF 5</small><progress max="5" value="'+(q+1)+'"></progress><h2>'+questions[q][0]+'</h2><div class="options" id="opts"></div></div>');questions[q].slice(1).forEach((v,i)=>$('opts').append(button(v,()=>{state.answers[q]=i;q++;if(q===5){save();matches()}else quiz()},true)));if(q)$('opts').append(button('Back',()=>{q--;quiz()},true))}
function ranked(){return people.map((p,id)=>({p,id,hits:state.answers.map((a,i)=>a===p[i+2]?questions[i][a+1]:null).filter(Boolean)})).sort((a,b)=>b.hits.length-a.hits.length)}
function matches(){if(state.answers.length!==5){q=0;quiz();return}page='matches';current=null;render('<small>YOUR DAILY FIVE</small><h1>Meet your <em>matches.</em></h1><p>Five at a time. Compatibility is based on your quiz, not a prediction of relationship success.</p><div class="grid" id="cards"></div>');let all=ranked(),active=all.filter(x=>state.chats[x.id]),fresh=all.filter(x=>!state.chats[x.id]&&!state.expired.includes(x.id));let chosen=[...active,...fresh.slice(0,Math.max(0,5-active.filter(x=>!state.chats[x.id].connected).length))];for(const {p,id,hits} of chosen){let a=document.createElement('article');a.innerHTML='<div class="avatar" aria-hidden="true">'+p[0][0]+'</div><h2>'+p[0]+', '+p[1]+' <small class="score">'+hits.length*20+'%</small></h2><p>'+p[7]+'</p><small>'+ (hits.length?'Shared: '+hits.join(' · '):'Explore a different perspective')+'</small><p class="timer" data-timer="'+id+'"></p>';a.append(button(state.chats[id]?'Open chat':'Start 24h chat',()=>openChat(id)));$('cards').append(a)}if(!chosen.length)$('cards').textContent='No more demo profiles today.';tick()}
function openChat(id){if(state.expired.includes(id))return matches();current=id;page='chat';let p=people[id];if(!state.chats[id]){state.chats[id]={expires:Date.now()+24*H,messages:[{from:'them',text:'Hey! What are you up to today? (Demo)'}],sent:[],mine:false,theirs:false,connected:false};save()}let c=state.chats[id];render('<div class="chat"><div id="back"></div><h2>'+p[0]+'</h2><p class="timer" data-timer="'+id+'"></p><small id="deadline"></small><div class="panel"><div class="messages" id="messages"></div><form id="send"><input id="message" maxlength="1000" aria-label="Message" placeholder="Say something…"><button>Send</button></form><div class="actions" id="actions"></div><p id="consent"></p></div></div>');$('back').append(button('← Matches',matches,true));$('send').onsubmit=e=>{e.preventDefault();if(!valid(id))return;let t=$('message').value.trim();if(!t)return;c.messages.push({from:'me',text:t});$('message').value='';save();draw();setTimeout(()=>{if(!valid(id))return;c.messages.push({from:'them',text:'Tell me more! (Simulated reply)'});save();if(page==='chat'&&current===id)draw()},700)};$('actions').append(button('I want to continue',()=>{if(!valid(id))return;c.mine=true;connect(c);draw()}),button('Simulate other user accepting',()=>{if(!valid(id))return;c.theirs=true;connect(c);draw()},true),button('Plan a date',()=>datePlan(id),true));draw();tick()}
function valid(id){let c=state.chats[id];return !!c&&(c.connected||c.expires>Date.now())}function connect(c){c.connected=c.mine&&c.theirs;save();if(c.connected)notice('Mutual connection saved on this device.')}function draw(){let c=state.chats[current];if(!c||!$('messages'))return;$('messages').replaceChildren();for(const m of c.messages){let d=document.createElement('div');d.className='bubble '+(m.from==='me'?'me':'');d.textContent=m.text;$('messages').append(d)}$('messages').scrollTop=$('messages').scrollHeight;$('consent').textContent=c.connected?'Connected · no expiration':c.mine?'Your acceptance saved. Waiting for the other person.':'Both people must accept to keep this chat.'}
function datePlan(id){if(!valid(id))return matches();page='date';render('<div class="panel"><h2>Meet somewhere real</h2><p>Example Orlando venues and hypothetical offers; no partnership or discount is confirmed. Choose a public setting. Bars are 21+.</p><div id="venues"></div><div id="return"></div></div>');for(const [name,offer] of venues){let d=document.createElement('article');d.textContent=name+' · Example offer: '+offer;$('venues').append(d)}$('return').append(button('Back to chat',()=>openChat(id),true))}
function format(ms){let s=Math.max(0,Math.ceil(ms/1000));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function notify(t){notice(t);if(state.reminders&&'Notification'in window&&Notification.permission==='granted'){if(navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification('Five',{body:t,tag:t}):new Notification('Five',{body:t})).catch(()=>{});else try{new Notification('Five',{body:t})}catch{}}}
function tick(){let changed=false,closed=false;for(const [id,c] of Object.entries(state.chats)){if(c.connected)continue;let left=c.expires-Date.now();if(left<=0){delete state.chats[id];state.expired.push(Number(id));changed=true;closed=true;notice('A chat expired and its local messages were removed.');continue}let due=[12*H,H,H/4].filter(n=>left<=n&&!c.sent.includes(n));if(due.length){c.sent.push(...due);changed=true;if(state.reminders)notify('Your chat with '+people[id][0]+' has '+format(left)+' left.')}}if(changed)save();if(closed&&(page==='matches'||((page==='chat'||page==='date')&&!valid(current)))){matches();return}document.querySelectorAll('[data-timer]').forEach(el=>{let c=state.chats[el.dataset.timer];el.textContent=c?(c.connected?'Connected':format(c.expires-Date.now())+' left'):''});if($('deadline')&&state.chats[current]){let c=state.chats[current];$('deadline').textContent=c.connected?'Saved locally':'Ends '+new Date(c.expires).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})+' · '+Intl.DateTimeFormat().resolvedOptions().timeZone}}
$('home').onclick=home;$('matches').onclick=matches;$('alerts').onclick=async()=>{state.reminders=!state.reminders;save();if(state.reminders&&'Notification'in window){try{await Notification.requestPermission()}catch{}}notice(state.reminders?'Reminders on: 12 hours, 1 hour, 15 minutes. Browser alerts depend on permission and an open page.':'Reminders off.');$('alerts').textContent=state.reminders?'Reminders on':'Reminders off'};if(state.reminders)$('alerts').textContent='Reminders on';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});setInterval(tick,1000);document.addEventListener('visibilitychange',tick);home();tick();
</script></body></html>
